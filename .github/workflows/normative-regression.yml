name: Normative JSON regression

on:
  push:
    branches:
      - docs/normative-migration-state-20260922

jobs:
  normative-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest==9.1.1 jsonschema==4.26.0
      - name: Python syntax
        run: python -m compileall -q app
      - name: Frontend syntax
        run: node --check frontend/assets/js/main-page/norms.js
      - name: Normative Validator regression
        run: python -m pytest tests/normative/test_normative_validator.py -v
      - name: Generator regression
        run: python -m pytest tests/normative/test_normative_json_generator.py -v
